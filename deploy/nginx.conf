# HTTP alternative to Caddy: two virtual hosts on the same VM.
# Production HTTPS uses deploy/Caddyfile instead (docker-compose.https.yml).
client_max_body_size 550M;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
proxy_connect_timeout 60s;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

server {
    listen 80 default_server;
    server_name valz.limitlesstech-co.com 157.254.192.65 localhost;

    location = /docs { proxy_pass http://api:8000; }
    location = /redoc { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # The frontend's /api/* proxy is the same-origin fallback.
    location / {
        proxy_pass http://frontend:3000;
    }
}

server {
    listen 80;
    server_name gemba.limitlesstech-co.com;

    # Compatibility with older /api/* clients; strip only the /api/ prefix.
    location /api/ {
        proxy_pass http://api:8000/;
    }

    location / {
        proxy_pass http://api:8000;
    }
}
