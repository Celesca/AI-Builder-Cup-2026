# Full system: nginx (80) -> frontend (SvelteKit, :3000) -> ai_backend (FastAPI, :8000)
# The dashboard calls /api/* on the frontend, which proxies to ai_backend; ai_backend is not public
# except for its API docs below.
server {
    listen 80;
    server_name gemba.limitlesstech-co.com 157.254.192.65 localhost;

    # Video uploads (ai_backend MAX_VIDEO_MB is 500), streamed instead of buffered to disk
    client_max_body_size 550M;
    proxy_request_buffering off;

    # /api/analysis/analyze stays open until the analysis finishes
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ai_backend API docs (Swagger UI, ReDoc, OpenAPI spec)
    location = /docs { proxy_pass http://api:8000; }
    location = /redoc { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    location / {
        proxy_pass http://frontend:3000;
    }
}
